<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="Nabeel Malik — Writing" href="/rss.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      try { var home = location.pathname === '/' || !location.hash || location.hash === '#/'; if (home && !sessionStorage.getItem('nm-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.intro = '1'; } catch (e) {}
    </script>
    <style>html[data-intro] body::after { content: ''; position: fixed; inset: 0; background: #ecebe4; z-index: 249; animation: nm-failsafe 0s 4s forwards; } @keyframes nm-failsafe { to { visibility: hidden; } }</style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
