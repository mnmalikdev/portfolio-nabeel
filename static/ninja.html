<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ninja Vanish</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;}
  video{display:none}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
  #state{background:#000a;padding:6px 10px;border-radius:8px;font-weight:600;font-size:14px}
  #bar{width:110px;height:8px;background:#ffffff22;border-radius:4px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#ffd400}
  #controls{position:fixed;bottom:18px;left:0;right:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 12px}
  button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;background:#fff;color:#111}
  button.ghost{background:#ffffff1f;color:#fff}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:#0b0b0d}
  #overlay h1{margin:0;font-size:28px}
  #overlay p{margin:0;max-width:340px;line-height:1.45;color:#bbb}
  #msg{position:fixed;top:50%;left:0;right:0;text-align:center;font-size:30px;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hud"><span id="state">loading…</span><div id="bar"><i></i></div></div>
<div id="msg"></div>
<div id="controls" style="display:none">
  <button id="plateBtn" class="ghost">📸 Re-capture room</button>
  <button id="toggleBtn">💨 Poof</button>
  <button id="flipBtn" class="ghost">🔄 Camera</button>
</div>
<div id="overlay">
  <h1>🥷 Ninja Vanish</h1>
  <p>Make the ninja seal: <b>index + middle finger up, pressed together</b>, other fingers folded. Hold it for a moment and you vanish. Do it again to come back.</p>
  <p>First it photographs your empty room, so you'll get a countdown to step out of frame (or tilt the phone away).</p>
  <button id="startBtn">Start camera</button>
  <p id="err" style="color:#ff7a7a"></p>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const HOLD = 600, COOLDOWN = 1500, TRANSITION = 1300;
const v = document.getElementById('v'), c = document.getElementById('c'), ctx = c.getContext('2d');
const stateEl = document.getElementById('state'), barEl = document.querySelector('#bar i'), msgEl = document.getElementById('msg');
const plateCanvas = document.createElement('canvas'), pctx = plateCanvas.getContext('2d');

let landmarker, facing = 'user', stream, plateReady = false;
let state = 'VISIBLE', t0 = 0, lastTrigger = 0, holdStart = null, capturing = false;
let particles = [], lastVideoTime = -1, handX = 0.5;

const smooth = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

function isSeal(lm) {
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const ext = (t, p) => d(0, t) > d(0, p) * 1.15;
  const fold = (t, p) => d(0, t) < d(0, p);
  const together = d(8, 12) < d(5, 9) * 1.3;
  return ext(8, 6) && ext(12, 10) && fold(16, 14) && fold(20, 18) && together;
}

function burst(cx, cy) {
  const s = c.width / 640;
  for (let i = 0; i < 110; i++) {
    const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 11) * s;
    particles.push({
      x: cx + (Math.random() - .5) * 90 * s, y: cy + (Math.random() - .5) * 140 * s,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .7 - 2 * s,
      r: (25 + Math.random() * 30) * s, g: (1.5 + Math.random() * 3) * s,
      life: 1, decay: .010 + Math.random() * .012
    });
  }
}

function drawSmoke() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vx *= .92; p.vy = p.vy * .92 - .12; p.r += p.g; p.life -= p.decay;
    const a = Math.min(1, p.life * 1.3) * .55;
    const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    gr.addColorStop(0, `rgba(225,228,232,${a})`);
    gr.addColorStop(.6, `rgba(210,214,220,${a * .6})`);
    gr.addColorStop(1, 'rgba(200,205,210,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawVideo(target, tctx) {
  tctx.save();
  if (facing === 'user') { tctx.translate(target.width, 0); tctx.scale(-1, 1); }
  tctx.drawImage(v, 0, 0, target.width, target.height);
  tctx.restore();
}

async function capturePlate() {
  capturing = true; plateReady = false;
  for (let n = 4; n > 0; n--) { msgEl.textContent = `Step out of frame… ${n}`; await new Promise(r => setTimeout(r, 1000)); }
  drawVideo(plateCanvas, pctx);
  msgEl.textContent = 'Room captured ✓';
  setTimeout(() => msgEl.textContent = '', 900);
  plateReady = true; capturing = false;
}

function trigger() {
  const now = performance.now();
  if (!plateReady || now - lastTrigger < COOLDOWN || !(state === 'VISIBLE' || state === 'GONE')) return;
  state = state === 'VISIBLE' ? 'VANISHING' : 'APPEARING';
  t0 = now; lastTrigger = now; holdStart = null;
  const hx = facing === 'user' ? 1 - handX : handX;
  burst((0.4 * hx + 0.3) * c.width, c.height * 0.55);
  if (navigator.vibrate) navigator.vibrate(40);
}

function loop() {
  const now = performance.now();
  if (v.readyState >= 2) {
    if (c.width !== v.videoWidth) {
      c.width = plateCanvas.width = v.videoWidth; c.height = plateCanvas.height = v.videoHeight;
    }
    // gesture detection always runs on the real feed
    if (landmarker && v.currentTime !== lastVideoTime) {
      lastVideoTime = v.currentTime;
      const res = landmarker.detectForVideo(v, now);
      let seal = false;
      for (const lm of res.landmarks || []) if (isSeal(lm)) { seal = true; handX = lm[9].x; }
      holdStart = seal ? (holdStart ?? now) : null;
      if (holdStart && now - holdStart >= HOLD) trigger();
    }

    const t = (now - t0) / TRANSITION;
    let mix = 0;
    if (state === 'VANISHING') { mix = smooth((t - .12) / .3); if (t >= 1) state = 'GONE'; }
    else if (state === 'APPEARING') { mix = 1 - smooth((t - .12) / .3); if (t >= 1) state = 'VISIBLE'; }
    else mix = state === 'GONE' ? 1 : 0;

    if (mix < 1) drawVideo(c, ctx);
    if (mix > 0 && plateReady) { ctx.globalAlpha = mix; ctx.drawImage(plateCanvas, 0, 0); ctx.globalAlpha = 1; }

    if (state === 'VANISHING' || state === 'APPEARING') {
      const f = Math.max(0, 1 - Math.abs(t - .1) / .08) * .6;
      if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, c.width, c.height); }
    }
    drawSmoke();

    stateEl.textContent = capturing ? 'capturing room' : state === 'GONE' ? '👻 GONE' : state;
    barEl.style.width = holdStart ? Math.min(100, (now - holdStart) / HOLD * 100) + '%' : '0';
  }
  requestAnimationFrame(loop);
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  v.srcObject = stream; await v.play();
}

document.getElementById('startBtn').onclick = async () => {
  const err = document.getElementById('err');
  try {
    err.textContent = 'Loading hand tracking…';
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 2
    });
    await startCamera();
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('controls').style.display = 'flex';
    requestAnimationFrame(loop);
    capturePlate();
  } catch (e) {
    err.textContent = 'Error: ' + (e.message || e) + ' (needs https and camera permission)';
  }
};
document.getElementById('toggleBtn').onclick = trigger;
document.getElementById('plateBtn').onclick = () => { if (!capturing) { state = 'VISIBLE'; capturePlate(); } };
document.getElementById('flipBtn').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; await startCamera(); state = 'VISIBLE'; capturePlate(); };
</script>
</body>
</html>
